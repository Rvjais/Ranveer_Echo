[package]
name = "ranveer_eco_renew"
version = "0.1.0"
description = "Ranveer - Rust native desktop AI assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "ranveer_eco_renew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
base64 = "0.22"
once_cell = "1"
rand = "0.8"
dirs = "5"
cpal = "0.15"
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
tiny_http = "0.12"
